<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie | Fahrtkosten App</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.6;
    font-size: 16px;
  }

  /* Header */
  .page-header {
    background: linear-gradient(135deg, #2a3545 0%, #36455a 100%);
    color: #fff;
    padding: 26px 32px;
  }
  .page-header-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
  }
  .hero-icon {
    width: 56px; height: 56px; border-radius: 13px;
    display: block; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .page-header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
  .page-header .subtitle { margin-top: 5px; font-size: 0.9rem; color: rgba(255,255,255,0.55); }

  /* Container */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  /* Section card */
  .section {
    background: #fff;
    border-radius: 16px;
    padding: 28px 28px 32px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  .section-title {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #4a7fa5;
    margin-bottom: 16px;
  }

  /* Portrait grid – iPhone screenshots */
  .grid-portrait {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .grid-portrait .thumb {
    aspect-ratio: 9 / 19.5;
    border-radius: 10px;
    overflow: hidden;
    background: #e8e8ea;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .grid-portrait .thumb:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  }

  /* Landscape grid – wider screenshots */
  .grid-landscape {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .grid-landscape .thumb {
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #e8e8ea;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .grid-landscape .thumb:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  }

  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Divider between sections */
  .grid-divider { margin-top: 16px; }

  /* Footer */
  .footer-card {
    background: #fff;
    border-radius: 16px;
    padding: 24px 32px;
    margin-top: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    text-align: center;
    color: #6e6e73;
    font-size: 0.88rem;
    line-height: 1.8;
  }
  .footer-card a { color: #4a7fa5; text-decoration: none; }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    object-fit: contain;
  }
  .lightbox-close {
    position: fixed;
    top: 20px; right: 24px;
    color: #fff; font-size: 1.8rem;
    cursor: pointer; background: none; border: none;
    padding: 4px 10px; opacity: 0.75;
  }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-prev, .lightbox-next {
    position: fixed;
    top: 50%; transform: translateY(-50%);
    color: #fff; font-size: 2rem;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    border: none; padding: 12px 16px;
    border-radius: 8px; opacity: 0.8; line-height: 1;
  }
  .lightbox-prev { left: 16px; }
  .lightbox-next { right: 16px; }
  .lightbox-prev:hover, .lightbox-next:hover { opacity: 1; background: rgba(255,255,255,0.2); }
  .lightbox-counter {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 0.82rem;
  }

  /* Watch grid */
  .grid-watch {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .grid-watch .thumb {
    aspect-ratio: 396 / 484;
    border-radius: 40% / 33%;
    overflow: hidden;
    background: #111;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .grid-watch .thumb:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  }

  /* Responsive */
  @media (max-width: 700px) {
    .page-header { padding: 20px; }
    .page-header h1 { font-size: 1.3rem; }
    .section { padding: 20px 16px 24px; }
    .grid-portrait { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-landscape { grid-template-columns: 1fr; gap: 8px; }
    .grid-watch { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .lightbox-prev { left: 6px; }
    .lightbox-next { right: 6px; }
  }
  @media (max-width: 420px) {
    .grid-portrait { grid-template-columns: repeat(2, 1fr); }
    .grid-watch { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-prev" onclick="event.stopPropagation(); navigate(-1)">‹</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-next" onclick="event.stopPropagation(); navigate(1)">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script>
  const images = Array.from(document.querySelectorAll('.thumb img')).map(img => img.src);
  let current = 0;

  function openLightbox(index) {
    current = index;
    document.getElementById('lightbox-img').src = images[current];
    document.getElementById('lightbox-counter').textContent = (current + 1) + ' / ' + images.length;
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(e) {
    if (e && e.target !== document.getElementById('lightbox')) return;
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }

  function navigate(dir) {
    current = (current + dir + images.length) % images.length;
    document.getElementById('lightbox-img').src = images[current];
    document.getElementById('lightbox-counter').textContent = (current + 1) + ' / ' + images.length;
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'Escape') {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }
  });
</script>
